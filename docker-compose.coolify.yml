# Compose for Coolify (Docker Compose build pack, compose path /docker-compose.coolify.yml).
# Same as docker-compose.yml, but no host port: Coolify's proxy routes the domain set on the
# `web` service (e.g. https://fotky.bytynadlani.cz:3000 = container port 3000) and issues the certificate.

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.1-flash-lite-image}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_IMAGE_MODEL: "${OPENAI_IMAGE_MODEL:-gpt-image-1}"
      SESSION_SECRET: "${SESSION_SECRET}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-10}"
    volumes:
      - roomify-data:/data
    expose:
      - "3000"

volumes:
  roomify-data:
